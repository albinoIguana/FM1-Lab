<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FM1 Lab · Visual Language Preview</title>
<style>
:root{color-scheme:dark;background:#080d13;color:#f4f7fa;font:14px system-ui,sans-serif}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(ellipse at 50% 18%,#182632,#080d13 68%)}
main{width:min(100%,620px);display:grid;justify-items:center;gap:16px}h1{margin:0;color:#b9c7d2;font-size:12px;letter-spacing:.2em}
.device{width:min(86vw,440px);aspect-ratio:1;padding:11px;border-radius:30px;background:linear-gradient(145deg,#3b4650,#111820 60%,#06090d);box-shadow:0 22px 65px #000c,inset 0 1px 1px #ffffff35;overflow:hidden}
.glass{width:100%;height:100%;border-radius:19px;overflow:hidden;background:#080d13;box-shadow:inset 0 0 0 1px #ffffff25}
canvas{display:block;width:100%;height:100%;image-rendering:pixelated}
.controls{width:min(100%,560px);display:grid;gap:10px}.group{display:flex;flex-wrap:wrap;justify-content:center;gap:7px}
button{border:1px solid #344451;border-radius:9px;background:#121e28;color:#e6edf3;padding:9px 12px;font:650 11px system-ui;letter-spacing:.07em}
button:active{background:#26d9e8;color:#071017;border-color:#26d9e8}.caption{max-width:500px;margin:0;color:#91a2af;font-size:11px;line-height:1.5;text-align:center}
@media(max-width:420px){body{padding:14px}.device{width:min(92vw,440px);padding:8px;border-radius:24px}.glass{border-radius:15px}}
</style></head><body><main><h1>FM1 LAB · FOUR-QUADRANT UI STUDY</h1>
<div class="device"><div class="glass"><canvas id="screen" width="240" height="240" aria-label="FM1 240 by 240 interface preview"></canvas></div></div>
<div class="controls"><div class="group"><button data-btn="HOME">HOME</button><button data-btn="SEL">SEL</button><button data-btn="EDIT">EDIT</button><button data-btn="GLO">GLO</button><button data-btn="SAVE">SAVE</button></div>
<div class="group"><button data-enc="select">PATCH −</button><button data-enc="select" data-delta="1">PATCH +</button><button data-enc="k1">K1 −</button><button data-enc="k1" data-delta="1">K1 +</button><button data-enc="k2">K2 −</button><button data-enc="k2" data-delta="1">K2 +</button><button data-enc="k3">K3 −</button><button data-enc="k3" data-delta="1">K3 +</button><button data-enc="k4">K4 −</button><button data-enc="k4" data-delta="1">K4 +</button></div></div>
<p class="caption">Design-direction preview: consistent rounded 2×2 panels, bold four-engine color identities, compact status, and a physical-control footer. This is a browser-side visual study—not yet the compiled C firmware renderer or a hardware test.</p></main>
<script>
const c=document.querySelector('#screen').getContext('2d');c.imageSmoothingEnabled=false;
const colors=['#24d7e8','#e34bd2','#f2d43b','#ff5265'],bg='#080d13',panel='#111d27',line='#344653',white='#f4f7fa',muted='#8fa2b1';
const names=['TINE EP','GLASS BELL','ROUND BASS','BRASS SECT'],macroNames=['BRIGHTNESS','BODY','MOTION','EDGE'];
const s={page:0,patch:0,level:[92,78,85,70],macro:[50,50,50,50],enabled:[true,true,true,true],master:82,oct:0,msg:''};
function rr(x,y,w,h,r,fill,stroke){c.beginPath();c.roundRect(x,y,w,h,r);c.fillStyle=fill;c.fill();if(stroke){c.strokeStyle=stroke;c.lineWidth=1;c.stroke()}}
function txt(t,x,y,size=7,color=white,align='left'){c.font='700 '+size+'px system-ui';c.textAlign=align;c.textBaseline='middle';c.fillStyle=color;c.fillText(String(t),x,y)}
function lineRect(x,y,w,h,color){rr(x,y,w,h,3,color)}
function header(title){rr(5,5,230,23,7,'#101a23');txt(title,12,17,9,white);txt('CPU --%',226,12,5,muted,'right');txt('MIDI',226,21,5,muted,'right')}
function tile(x,y,w,h,accent,title,sub,val,selected=false){rr(x,y,w,h,8,panel,selected?accent:line);rr(x+5,y+6,3,h-12,2,accent);txt(title,x+13,y+14,7,white);txt(sub,x+13,y+27,5,muted);txt(val,x+w-8,y+14,8,accent,'right')}
function footer(labels){rr(5,211,230,24,7,'#101a23');for(let i=0;i<4;i++){const x=10+i*56;rr(x,216,48,14,4,'#1b2a35');txt('K'+(i+1),x+5,223,6,colors[i]);txt(labels[i],x+17,223,5,white)}txt((s.page+1)+'/4',230,204,6,muted,'right')}
function home(){for(let i=0;i<4;i++){let x=7+(i%2)*116,y=35+Math.floor(i/2)*84;rr(x,y,110,78,9,panel,i===s.patch?colors[i]:line);rr(x+7,y+8,4,62,2,colors[i]);txt(names[i],x+17,y+17,8,white);txt(s.enabled[i]?'ON':'OFF',x+17,y+31,6,s.enabled[i]?'#55e58b':'#ff5265');txt('ALG 05',x+17,y+45,6,muted);txt('LVL '+s.level[i],x+17,y+62,6,colors[i]);rr(x+63,y+58,38,5,3,'#263742');rr(x+63,y+58,38*s.level[i]/127,5,3,colors[i])}} 
function macros(){for(let i=0;i<4;i++){let x=7+(i%2)*116,y=35+Math.floor(i/2)*84;rr(x,y,110,78,9,panel,colors[s.patch]);txt(macroNames[i],x+10,y+15,7,white);txt(s.macro[i],x+99,y+15,10,colors[s.patch],'right');rr(x+10,y+38,90,7,4,'#2a3944');rr(x+10,y+38,90*s.macro[i]/100,7,4,colors[s.patch]);rr(x+54,y+35,2,13,1,white);txt(i===0?'FM DEPTH':i===1?'RATIO / ENV':i===2?'LFO / DEPTH':'FEEDBACK',x+10,y+61,5,muted)}}
function roles(){const labels=[['OP 1','CARRIER'],['OP 2','MODULATOR'],['OP 3','CARRIER'],['OP 4','MODULATOR']];for(let i=0;i<4;i++){let x=7+(i%2)*116,y=35+Math.floor(i/2)*84;rr(x,y,110,78,9,panel,i%2===0?colors[s.patch]:line);txt(labels[i][0],x+10,y+17,9,white);txt(labels[i][1],x+10,y+34,6,i%2===0?colors[s.patch]:muted);txt(i<2?'PAIR A':'PAIR B',x+10,y+57,5,muted)}}
function global(){const vals=[['MASTER',s.master+'%'],['OCTAVE',(s.oct>=0?'+':'')+s.oct],['BLUETOOTH','ON'],['MIDI INPUT','READY']];for(let i=0;i<4;i++){let x=7+(i%2)*116,y=35+Math.floor(i/2)*84;rr(x,y,110,78,9,panel,colors[i]);txt(vals[i][0],x+10,y+18,6,muted);txt(vals[i][1],x+10,y+43,13,colors[i]);txt(i===0?'OUTPUT LEVEL':i===1?'TRANSPOSE':i===2?'WIRELESS LINK':'INPUT ACTIVITY',x+10,y+63,5,muted)}}
function render(){c.fillStyle=bg;c.fillRect(0,0,240,240);header(['INSTRUMENT','PATCH MACROS','OPERATOR MAP','GLOBAL'][s.page]);if(s.page===0)home();if(s.page===1)macros();if(s.page===2)roles();if(s.page===3)global();footer(s.page===1?['BRIGHT','BODY','MOTION','EDGE']:s.page===0?['PATCH 1','PATCH 2','PATCH 3','PATCH 4']:['SELECT','EDIT','VALUE','PAGE'])}
function button(b){if(b==='HOME')s.page=0;if(b==='SEL')s.page=1;if(b==='EDIT')s.page=2;if(b==='GLO')s.page=3;render()}
function enc(k,d){if(k==='select')s.patch=(s.patch+d+4)%4;else{let i=Number(k.slice(1))-1;if(s.page===1)s.macro[i]=Math.max(0,Math.min(100,s.macro[i]+d));else if(s.page===0)s.level[i]=Math.max(0,Math.min(127,s.level[i]+d));else if(s.page===3&&i===0)s.master=Math.max(0,Math.min(100,s.master+d));}render()}
document.querySelectorAll('[data-btn]').forEach(b=>b.onclick=()=>button(b.dataset.btn));document.querySelectorAll('[data-enc]').forEach(b=>b.onclick=()=>enc(b.dataset.enc,Number(b.dataset.delta||-1)));render();
</script></body></html>
