# FM1-Lab native foundation. Pinned fm1-base and felucca-bsp platform.
name = "fm1lab"
id_prefix = "FM-1_97"
usb_manufacturer = "FM1-Lab"
usb_product = "FM1-Lab"
licence = "GPL-3.0-only"
credits = "FM1-Lab native app on fm1-base; FM6 engine and sequencer integrations are being added."
unity_opt = "z"
ble = true
ble_stack = "own"
ble_central = true
ble_pairing = false
usb_audio_in = true
usb_audio_out = false
o2 = ["dsp/fm6.c", "dsp/seq.c"]
include = ["dsp"]
gen = [
  "../upstream/felucca/tools/gen_tables.py {gen}/felucca_tables.h",
  "../upstream/felucca/tools/gen_fm6_patches.py {gen}/felucca_fm6.h"
]
