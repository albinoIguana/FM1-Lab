name: Native FM1 browser emulator

on:
  push:
    branches: [feature/native-instrument-macro-workflow]
    paths:
      - "app/**"
      - "firmware/**"
      - "base"
      - "upstream/felucca"
      - ".gitmodules"
      - ".github/workflows/native-web-emulator.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: native-web-emulator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  emulator:
    runs-on: ubuntu-latest
    steps:
      - name: Check out FM1-Lab and pinned submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build-time Python dependencies
        run: python -m pip install --upgrade pip Pillow

      - name: Set up Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: "latest"
          actions-cache-folder: "emsdk-cache"

      - name: Build native FM1 browser emulator
        run: python3 base/tools/build.py app --web

      - name: Verify emulator bundle
        id: verify
        run: |
          test -s app/build/emu/index.html
          test -s app/build/emu/app.wasm
          test -s app/build/emu/worklet.js
          echo "Native FM1 emulator bundle:"
          du -h app/build/emu/*

      # Always preserve a downloadable build even if branch publishing is unavailable.
      - name: Upload emulator bundle
        uses: actions/upload-artifact@v4
        with:
          name: fm1lab-native-emulator-${{ github.sha }}
          path: app/build/emu/
          if-no-files-found: error
          retention-days: 14

      - name: Publish browser preview on the feature branch
        id: publish
        run: |
          git fetch origin "$GITHUB_REF_NAME"
          remote_sha="$(git rev-parse FETCH_HEAD)"
          if ! git diff --quiet "$GITHUB_SHA" "$remote_sha" -- app firmware base upstream/felucca .gitmodules; then
            echo "Firmware sources changed during this build; a newer run must publish the emulator."
            exit 1
          fi
          git reset --hard "$remote_sha"
          mkdir -p native-emulator
          cp app/build/emu/index.html app/build/emu/app.wasm app/build/emu/worklet.js native-emulator/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add native-emulator/index.html native-emulator/app.wasm native-emulator/worklet.js
          if ! git diff --cached --quiet; then
            git commit -m "build: publish native emulator browser preview"
            pushed=0
            for attempt in 1 2 3; do
              echo "Publishing preview (attempt ${attempt}/3)"
              if git push origin HEAD:${GITHUB_REF_NAME}; then
                pushed=1
                break
              fi
              sleep $((attempt * 5))
            done
            if [ "$pushed" -ne 1 ]; then
              echo "::warning::Preview bundle uploaded as an Actions artifact, but branch publishing failed after 3 attempts."
              echo "preview_published=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "preview_published=true" >> "$GITHUB_OUTPUT"
          echo "preview_commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "Preview source commit: $(git rev-parse HEAD)"
