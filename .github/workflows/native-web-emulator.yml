name: Native FM1 browser emulator

on:
  push:
    branches: [feature/native-instrument-macro-workflow]
    paths:
      - "app/**"
      - "firmware/**"
      - "base"
      - "upstream/felucca"
      - ".gitmodules"
      - ".github/workflows/native-web-emulator.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  emulator:
    runs-on: ubuntu-latest
    steps:
      - name: Check out FM1-Lab and pinned submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: "latest"
          actions-cache-folder: "emsdk-cache"

      - name: Build native FM1 browser emulator
        run: python3 base/tools/build.py app --web

      - name: Verify emulator bundle
        run: |
          test -s app/build/emu/index.html
          test -s app/build/emu/app.wasm
          test -s app/build/emu/worklet.js
          echo "Native FM1 emulator bundle:"
          du -h app/build/emu/*

      - name: Upload emulator bundle
        uses: actions/upload-artifact@v4
        with:
          name: fm1lab-native-emulator-${{ github.sha }}
          path: app/build/emu/
          if-no-files-found: error
          retention-days: 14
