name: Native FM1 browser emulator

on:
  push:
    branches: [main, fix/shipwreck-patch-presets-track-audio, fix/shipwreck-track-cache, integration/shipwreck-unified]
    paths:
      - "app/**"
      - "tests/fm6_engine.test.c"
      - "tests/capture-home-refusal.mjs"
      - "firmware/**"
      - "base"
      - "upstream/felucca"
      - ".gitmodules"
      - ".github/workflows/native-web-emulator.yml"
      - ".github/workflows/native-build.yml"
      - ".github/workflows/deploy-pages.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "app/**"
      - "tests/fm6_engine.test.c"
      - "firmware/**"
      - "base"
      - "upstream/felucca"
      - ".gitmodules"
      - ".github/workflows/native-web-emulator.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: native-web-emulator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  emulator:
    runs-on: ubuntu-latest
    steps:
      - name: Check out FM1-Lab and pinned submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build-time Python dependencies
        run: python -m pip install --upgrade pip Pillow

      - name: Set up Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: "latest"
          actions-cache-folder: "emsdk-cache"

      - name: Expand graphics canvas for 164px content panel
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("base/device/gfx.c")
          s = p.read_text()
          old = "#define APP_CANVAS_PX (240u * 144u)"
          new = "#define APP_CANVAS_PX (240u * 180u)"
          if old in s:
              s = s.replace(old, new, 1)
          elif new not in s:
              raise SystemExit("Expected 240x144 or already-expanded 240x180 graphics canvas definition")
          p.write_text(s)
          PY

      - name: Build native FM1 browser emulator
        run: python3 base/tools/build.py app --web

      - name: Verify emulator bundle
        run: |
          test -s app/build/emu/index.html
          test -s app/build/emu/app.wasm
          test -s app/build/emu/worklet.js
          echo "Native FM1 emulator bundle:"
          du -h app/build/emu/*

      - name: Capture HOME refusal overlay screenshot
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          python3 -m http.server 4173 --directory app/build/emu >/tmp/fm1-emu-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          node tests/capture-home-refusal.mjs

      - name: Upload emulator bundle
        uses: actions/upload-artifact@v4
        with:
          name: fm1lab-native-emulator-${{ github.sha }}
          path: app/build/emu/
          if-no-files-found: error
          retention-days: 14

      - name: Publish browser preview on main
        if: github.ref == 'refs/heads/main'
        run: |
          git fetch origin main
          remote_sha="$(git rev-parse FETCH_HEAD)"
          if ! git diff --quiet "$GITHUB_SHA" "$remote_sha" -- app firmware base upstream/felucca .gitmodules; then
            echo "Firmware sources changed during this build; a newer run must publish the emulator."
            exit 1
          fi
          git reset --hard "$remote_sha"
          mkdir -p native-emulator
          # index.html and worklet.js are the maintained emulator shell and
          # audio-worklet overlay. Only the generated WASM belongs to this build.
          cp app/build/emu/app.wasm native-emulator/
          node --check native-emulator/worklet.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add native-emulator/app.wasm
          if ! git diff --cached --quiet; then
            git commit -m "build: publish native FM1 emulator"
            git push origin HEAD:main
          fi
          # GITHUB_TOKEN pushes do not trigger other workflows; queue Pages explicitly.
          gh workflow run deploy-native-emulator.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}
