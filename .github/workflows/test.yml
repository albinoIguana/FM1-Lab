name: FM1-Lab checks

on:
  push:
    branches: ["main", "speedrun/**"]
  pull_request:
    branches: ["main"]

jobs:
  fm-engine-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
