name: FM1-Lab checks

on:
  push:
  pull_request:
    branches: ["main"]

jobs:
  fm-engine-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check src/main.js
      - run: node --check src/felucca-engine.js
      - run: node --check src/felucca-worklet.js
      - run: node --check src/native-fm6.js
      - run: node --check src/instrument.js
      - run: npm test
