name: FM1-Lab native engine checks

on:
  push:
    branches: ["feat/m-vave-native-instrument"]
  pull_request:
    branches: ["main"]

concurrency:
  group: fm1lab-native-engine-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  native-engine:
    runs-on: ubuntu-latest
    steps:
      - name: Check out FM1-Lab and M-VAVE source
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply idempotent M-VAVE simulator integration
        run: |
          node scripts/patch-m-vave-simulator-api.mjs
          node scripts/patch-m-vave-two-track-sequencer.mjs
          node scripts/patch-m-vave-instrument-home.mjs
          node --check scripts/patch-m-vave-instrument-home.mjs
          node scripts/patch-m-vave-instrument-sequencer-screen.mjs
          node --check scripts/patch-m-vave-instrument-sequencer-screen.mjs
          node scripts/patch-m-vave-native-patch-editor.mjs
          node --check scripts/patch-m-vave-native-patch-editor.mjs
          node scripts/patch-m-vave-audio-mixer.mjs
          node --check scripts/patch-m-vave-audio-mixer.mjs
      - name: Check application modules
        run: |
          node --check src/main-native.js
          node --check src/sequencer-model.js
          node --check src/sequencer-controls.js
          node --check src/instrument-session.js
          node --check src/ui/home-view.js
          node --check src/ui/sequencer-view.js
          node --check src/m-vave-engine.js
          node --check src/dx7-macros.js
          node --check src/dx7-voice.js
          node --check src/instrument-model.js
          node --test tests/instrument-session.test.js tests/sequencer-model.test.js
      - name: Test Instrument and macro behavior
        run: npm test
      - name: Build official M-VAVE browser simulator
        run: bash scripts/build-m-vave-simulator.sh
      - name: Verify required native engine API
        run: node scripts/check-m-vave-api.mjs vendor/m-vave-fm1/build/web/simulator.wasm

  device-firmware:
    if: github.ref == 'refs/heads/feat/m-vave-native-instrument'
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Check out FM1-Lab and pinned M-VAVE source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Node.js for source staging
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install CodeBlocks prerequisite
        shell: pwsh
        run: |
          choco install codeblocks --yes --no-progress
          if ($LASTEXITCODE -ne 0) {
            throw "CodeBlocks installation failed; the JieLi toolchain requires it."
          }

      - name: Install and verify JieLi Windows toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $clang = 'C:\JL\pi32\bin\clang.exe'
          if (!(Test-Path $clang)) {
            $installer = Join-Path $env:RUNNER_TEMP 'jieli-windows-toolchains-latest.exe'
            Invoke-WebRequest -Uri 'https://pkgman.jieliapp.com/s/win-toolchain' -OutFile $installer
            $p = Start-Process -FilePath $installer -ArgumentList '/S' -PassThru
            if (!$p.WaitForExit(600000)) {
              try { $p.Kill() } catch {}
              throw 'JieLi installer did not complete with the silent /S switch.'
            }
            $deadline = (Get-Date).AddMinutes(5)
            while ((Get-Date) -lt $deadline -and !(Test-Path $clang)) {
              Start-Sleep -Seconds 5
            }
          }
          if (!(Test-Path $clang)) {
            throw 'JieLi toolchain was not installed at C:\JL\pi32. Check the installer and CodeBlocks prerequisite.'
          }
          & $clang --version
          Get-FileHash $clang -Algorithm SHA256

      - name: Build the actual FM1 device firmware
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ./scripts/build-device-firmware.ps1 -Toolchain 'C:\JL\pi32'

      - name: Upload flashable firmware image
        uses: actions/upload-artifact@v4
        with:
          name: fm1lab-native-device-firmware
          path: vendor/m-vave-fm1/build/dx7/generated/FM1_OFFICIAL_OPEN.fwsc
          if-no-files-found: error
          retention-days: 14

      - name: Upload device build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fm1lab-device-build-diagnostics
          path: |
            vendor/m-vave-fm1/build/dx7/sdk.elf
            vendor/m-vave-fm1/build/dx7/sdk.map
            vendor/m-vave-fm1/build/dx7/generated/firmware-report.json
            vendor/m-vave-fm1/build/dx7/generated/package-report.json
          if-no-files-found: warn
          retention-days: 14
