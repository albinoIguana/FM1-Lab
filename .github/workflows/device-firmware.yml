name: Native FM1 device firmware

on:
  workflow_dispatch:
  push:
    branches:
      - feat/m-vave-native-instrument
    paths:
      - 'firmware/**'
      - 'scripts/build-device-firmware.ps1'
      - 'scripts/patch-m-vave-device-dx7-core.mjs'
      - 'scripts/patch-m-vave-audio-mixer.mjs'
      - '.github/workflows/device-firmware.yml'

permissions:
  contents: read

jobs:
  build-device-firmware:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Check out FM1-Lab and pinned M-VAVE source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Node.js for source staging
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Extract the pinned JieLi toolchain without running its GUI installer
        shell: pwsh
        timeout-minutes: 15
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Join-Path $env:RUNNER_TEMP 'jieli-windows-toolchains-2.5.3.exe'
          $extract = Join-Path $env:RUNNER_TEMP 'jieli-toolchain-extracted'
          $target = 'C:\\JL\\pi32'
          $clang = Join-Path $target 'bin\\clang.exe'

          # The SDK build consumes the compiler and libraries from C:\\JL\\pi32.
          # Code::Blocks is only an IDE prerequisite in JieLi's interactive
          # installer; it is not used by the SDK's Build.ps1 command-line build.
          # Extract the signed 2.5.3 Inno Setup payload directly so CI does not
          # need a desktop session to answer Code::Blocks' first-run dialogs.
          Invoke-WebRequest -Uri 'https://jl-update.oss-cn-shenzhen.aliyuncs.com/2.5.3.exe' -OutFile $installer
          $item = Get-Item -LiteralPath $installer
          if ($item.Length -lt 1MB) {
            throw "JieLi installer download is unexpectedly small ($($item.Length) bytes)."
          }
          Write-Host "Downloaded JieLi 2.5.3 installer: $($item.Length) bytes"
          Get-AuthenticodeSignature -FilePath $installer | Format-List Status,StatusMessage,SignerCertificate

          $sevenZip = @(
            (Join-Path $env:ProgramFiles '7-Zip\\7z.exe'),
            (Join-Path ${env:ProgramFiles(x86)} '7-Zip\\7z.exe')
          ) | Where-Object { $_ -and (Test-Path -LiteralPath $_) } | Select-Object -First 1
          if (!$sevenZip) {
            choco install 7zip.install --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Could not install 7-Zip to extract the JieLi toolchain payload.' }
            $sevenZip = Join-Path $env:ProgramFiles '7-Zip\\7z.exe'
          }
          if (!(Test-Path -LiteralPath $sevenZip)) { throw '7-Zip executable was not found.' }

          Remove-Item -LiteralPath $extract -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $extract -Force | Out-Null
          & $sevenZip x $installer "-o$extract" -y
          if ($LASTEXITCODE -ne 0) {
            throw "7-Zip could not extract the JieLi 2.5.3 installer payload (exit $LASTEXITCODE)."
          }

          $compiler = Get-ChildItem -LiteralPath $extract -Filter 'clang.exe' -File -Recurse |
            Where-Object { $_.FullName -match '[\\/]pi32[\\/]bin[\\/]clang\\.exe$' } |
            Select-Object -First 1
          if (!$compiler) {
            Write-Host 'Extracted installer contents:'
            Get-ChildItem -LiteralPath $extract -Force | Select-Object Name,Mode
            throw 'The JieLi installer archive did not expose pi32/bin/clang.exe; refusing to guess an installation layout.'
          }

          $pi32Root = Split-Path -Parent (Split-Path -Parent $compiler.FullName)
          New-Item -ItemType Directory -Path 'C:\\JL' -Force | Out-Null
          Remove-Item -LiteralPath $target -Recurse -Force -ErrorAction SilentlyContinue
          Copy-Item -LiteralPath $pi32Root -Destination $target -Recurse -Force
          if (!(Test-Path -LiteralPath $clang)) { throw "Extracted toolchain did not produce $clang" }

          & $clang --version
          if ($LASTEXITCODE -ne 0) { throw 'Extracted JieLi clang.exe failed to execute.' }
          $clangHash = (Get-FileHash $clang -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($clangHash -ne 'd4bc97cf421c1ccc373dd8924ce88720ff7457b3f1478d15df4aeda6ae923bce') {
            throw "Wrong JieLi compiler build: $clangHash. FM1 SDK requires toolchain 2.5.3 / PI32v2 clang 4.0.1."
          }
          Write-Host "Verified extracted JieLi PI32v2 clang 4.0.1 SHA-256: $clangHash"

      - name: Build the actual FM1 device firmware
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ./scripts/build-device-firmware.ps1 -Toolchain 'C:\JL\pi32'

      - name: Upload flashable firmware image
        uses: actions/upload-artifact@v4
        with:
          name: fm1lab-native-device-firmware
          path: vendor/m-vave-fm1/build/dx7/generated/FM1_OFFICIAL_OPEN.fwsc
          if-no-files-found: error
          retention-days: 14

      - name: Upload device build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fm1lab-device-build-diagnostics
          path: |
            vendor/m-vave-fm1/build/dx7/sdk.elf
            vendor/m-vave-fm1/build/dx7/sdk.map
            vendor/m-vave-fm1/build/dx7/generated/firmware-report.json
            vendor/m-vave-fm1/build/dx7/generated/package-report.json
            ${{ runner.temp }}/jieli-installer.log
          if-no-files-found: warn
          retention-days: 14
