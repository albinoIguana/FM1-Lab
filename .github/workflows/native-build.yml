name: Native FM1 build

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "patches/**"
      - "tools/generate_dx7_library.py"
      - "firmware/**"
      - "tests/**"
      - "docs/**"
      - "base"
      - "upstream/felucca"
      - ".gitmodules"
      - "build.sh"
      - ".github/workflows/native-build.yml"
      - ".github/workflows/deploy-pages.yml"
      - "scripts/build-web-installer.py"
      - "native-emulator/**"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  build:
    uses: zvenson/fm1-build/.github/workflows/build.yml@v1
    permissions:
      contents: write
      id-token: write
      attestations: write
    with:
      sdk: true
      build: |
        set -euo pipefail
        git submodule update --init --recursive base upstream/felucca
        # Keep the upstream BSP and FM1 base warning-clean without carrying a fork.
        # These two signed subtractions are promoted to int before the ternary's
        # unsigned zero branch; make their intended uint32_t arithmetic explicit.
        python3 - <<'PY'
        from pathlib import Path

        sense = Path("base/lib/sense.c")
        source = sense.read_text()
        fixes = {
            "rel = k->dland > k->d ? k->dland - k->d : 0u;":
            "rel = k->dland > k->d ? (uint32_t)k->dland - (uint32_t)k->d : 0u;",
            "rel = k->v > k->floor_ ? k->v - k->floor_ : 0u;":
            "rel = k->v > k->floor_ ? (uint32_t)k->v - (uint32_t)k->floor_ : 0u;",
        }
        for old, new in fixes.items():
            if old in source:
                source = source.replace(old, new, 1)
            elif new not in source:
                raise SystemExit(f"Expected upstream warning site not found: {old}")
        sense.write_text(source)

        build = Path("base/tools/build.py")
        source = build.read_text()
        old = 'CFLAGS = ["-Os", "-ffunction-sections", "-fno-builtin", "-Wall", "-Wno-unused-function"]'
        new = 'CFLAGS = ["-Werror", "-Os", "-ffunction-sections", "-fno-builtin", "-Wall", "-Wno-unused-function"]'
        if old in source:
            source = source.replace(old, new, 1)
        elif new not in source:
            raise SystemExit("Expected FM1 base CFLAGS definition not found")
        build.write_text(source)
        PY
        python3 - <<'PY'
        from pathlib import Path
        p = Path("base/device/gfx.c")
        source = p.read_text()
        old = "#define APP_CANVAS_PX (240u * 144u)"
        new = "#define APP_CANVAS_PX (240u * 180u)"
        if old in source:
            source = source.replace(old, new, 1)
        elif new not in source:
            raise SystemExit("Expected 240x144 or already-expanded 240x180 graphics canvas definition")
        p.write_text(source)
        PY
        python3 tools/generate_dx7_library.py
        git diff --exit-code -- app/fm1lab_dx7_data.h
        bash tests/test-fm6-engine.sh
        sh build.sh --release 0.1
        # Emit the real ELF section sizes. The linker has separate RAM,
        # RAMTEXT and POOL regions; a single "RAM used" number is misleading.
        python3 - <<'PY'
        import struct
        from pathlib import Path

        elf = Path("app/build/fm1lab.elf")
        image = Path("app/build/fm1lab.bin")
        data = elf.read_bytes()
        if data[:4] != bytes([127]) + b"ELF" or data[4] != 1 or data[5] != 1:
            raise SystemExit("memory audit: expected a little-endian ELF32 image")
        shoff = struct.unpack_from("<I", data, 32)[0]
        shentsize, shnum, shstrndx = struct.unpack_from("<HHH", data, 46)
        sections = [struct.unpack_from("<IIIIIIIIII", data, shoff + i * shentsize)
                    for i in range(shnum)]
        names_hdr = sections[shstrndx]
        names = data[names_hdr[4]:names_hdr[4] + names_hdr[5]]
        wanted = {".text", ".ram_text", ".data", ".bss", ".pool", ".noinit"}
        print("MEMORY AUDIT (linker ELF sections; bytes)")
        for section in sections:
            end = names.find(bytes([0]), section[0])
            name = names[section[0]:end].decode("ascii", "replace")
            if name in wanted:
                print(f"  {name:10s} {section[5]:8d}")
        if image.exists():
            print(f"  {'app.bin':10s} {image.stat().st_size:8d} / 581564 XIP-slot bytes")
        print("  limits: RAM .data+.bss 98304; RAMTEXT 32768; POOL 344064 (8192 minimum spare)")
        PY
        python3 base/tools/build.py app --host
      packages: app/build/fm1lab-0.1.fwsc
