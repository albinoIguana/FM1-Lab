name: Deploy FM1-Lab to GitHub Pages

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository and pinned emulator
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run FM1-Lab tests
        run: npm test

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.64

      - name: Fetch pinned Felucca firmware source
        run: |
          git clone https://github.com/hugelton/Felucca.git vendor/felucca
          git -C vendor/felucca checkout 743551712c36b3984392eea1dbe13a309907e17a
          git -C vendor/felucca submodule update --init --recursive

      - name: Build Felucca's browser-native firmware runtime
        working-directory: vendor/felucca
        run: |
          python -m pip install --disable-pip-version-check Pillow fonttools
          ./build.sh gen
          ./build.sh web

      - name: Install WebAssembly target
        run: rustup target add wasm32-unknown-unknown

      - name: Run upstream emulator Rust tests
        run: cargo test --release -p fm1-isa -p fm1-core -p fm1-soc -p fm1-web
        working-directory: vendor/fm1-emu

      - name: Run upstream emulator browser-code tests
        run: node --test web/*.test.mjs
        working-directory: vendor/fm1-emu

      - name: Build the upstream emulator as the primary site
        run: vendor/fm1-emu/tools/build_site.sh _site

      - name: Smoke-test emulated firmware and audio output
        run: node vendor/fm1-emu/web/smoke.mjs _site

      - name: Verify emulator flash persistence round trip
        run: node vendor/fm1-emu/web/persistence.wasm.mjs _site

      - name: Stage the Felucca runtime, designer and test console
        run: |
          mkdir -p _site/felucca _site/designer _site/scripts
          cp -R vendor/felucca/build/web/. _site/felucca/
          cp vendor/felucca/LICENSE vendor/felucca/LICENSING.md _site/felucca/
          cp -R vendor/felucca/LICENSES _site/felucca/
          cp index.html _site/designer/index.html
          cp -R src _site/designer/
          cp testing.html _site/testing.html
          cp .nojekyll _site/
          cp scripts/felucca-midi-smoke.fm1 _site/scripts/
          node scripts/inject-lab-link.mjs _site/index.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
