name: FM1-Lab · M-VAVE native engine

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out FM1-Lab and official M-VAVE source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply FM1-Lab extensions to M-VAVE simulator
        shell: bash
        run: |
          git -C vendor/m-vave-fm1 apply --check ../../patches/m-vave-instrument-api.patch
          git -C vendor/m-vave-fm1 apply ../../patches/m-vave-instrument-api.patch

      - name: Test the Instrument and macro models
        run: node --test tests/dx7-macros.test.js tests/instrument-model.test.js

      - name: Build the official M-VAVE browser engine
        shell: pwsh
        run: ./vendor/m-vave-fm1/tools/Build-Web.ps1 -LocalPreview

      - name: Verify the official engine API
        run: node scripts/check-m-vave-api.mjs vendor/m-vave-fm1/build/web/simulator.wasm

      - name: Assemble the FM1-Lab workshop
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force _site/src, _site/m-vave | Out-Null
          Copy-Item index.html _site/index.html
          Copy-Item .nojekyll _site/.nojekyll
          Copy-Item src/* _site/src/
          Copy-Item vendor/m-vave-fm1/sdk/Simulator.js _site/m-vave/Simulator.js
          Copy-Item vendor/m-vave-fm1/build/web/simulator.wasm _site/m-vave/simulator.wasm

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: windows-latest
    needs: build
    steps:
      - name: Deploy FM1-Lab
        id: deployment
        uses: actions/deploy-pages@v4
