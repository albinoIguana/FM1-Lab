name: Publish Shipwreck Web Installer and Emulator

on:
  workflow_run:
    workflows: ["Native FM1 build"]
    types: [completed]
    # Candidate is intentionally published only after its own verified Native FM1 build.
    branches: ["main", "fix/shipwreck-patch-presets-track-audio"]

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages-main
  cancel-in-progress: true

jobs:
  build:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Check out FM1-Lab and official M-VAVE source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }} # pin source, installer and emulator to the firmware run
          submodules: recursive
      - name: Download the verified native release package
        uses: actions/download-artifact@v4
        with:
          name: packages
          path: /tmp/fm1-release
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install native emulator build dependencies
        run: python -m pip install --upgrade pip Pillow
      - name: Set up Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: "latest"
          actions-cache-folder: "emsdk-cache"
      - name: Build native FM1 browser emulator from the firmware commit
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("base/device/gfx.c")
          s = p.read_text()
          old = "#define APP_CANVAS_PX (240u * 144u)"
          new = "#define APP_CANVAS_PX (240u * 180u)"
          if old in s:
              s = s.replace(old, new, 1)
          elif new not in s:
              raise SystemExit("Expected 240x144 or already-expanded 240x180 graphics canvas definition")
          p.write_text(s)
          PY
          python3 base/tools/build.py app --web
          test -s app/build/emu/index.html
          test -s app/build/emu/app.wasm
          test -s app/build/emu/worklet.js
      - name: Apply FM1-Lab extensions to M-VAVE simulator
        run: |
          node scripts/patch-m-vave-simulator-api.mjs
          node scripts/patch-m-vave-two-track-sequencer.mjs
          node scripts/patch-m-vave-instrument-home.mjs
          node scripts/patch-m-vave-instrument-sequencer-screen.mjs
          node scripts/patch-m-vave-native-patch-editor.mjs
          node scripts/patch-m-vave-instrument-macros.mjs
          node scripts/patch-m-vave-audio-mixer.mjs
      - name: Test Instrument and macro behavior
        run: npm test
      - name: Build official M-VAVE browser engine
        run: bash scripts/build-m-vave-simulator.sh
      - name: Verify official engine API
        run: node scripts/check-m-vave-api.mjs vendor/m-vave-fm1/build/web/simulator.wasm
      - name: Assemble the FM1-Lab workshop and native hardware emulator
        env:
          FM1_BUILD_NUMBER: ${{ github.event.workflow_run.run_number }}
          FM1_BUILD_RUN_ID: ${{ github.event.workflow_run.id }}
          FM1_BUILD_SHA: ${{ github.event.workflow_run.head_sha }}
          FM1_BUILD_DATE: ${{ github.event.workflow_run.created_at }}
        run: |
          node --check native-emulator/worklet.js
          mkdir -p _site/src _site/m-vave _site/native-emulator
          python3 scripts/build-web-installer.py /tmp/fm1-release/app/build/fm1lab-0.1.fwsc _site/install
          test -s _site/install/firmware/fm1lab-0.1.fwsc
          grep -q \"firmware/fm1lab-0.1.fwsc\" _site/install/index.html
          cp index.html _site/index.html
          cp .nojekyll _site/.nojekyll
          cp -R src/. _site/src/
          cp vendor/m-vave-fm1/sdk/Simulator.js _site/m-vave/Simulator.js
          cp vendor/m-vave-fm1/build/web/simulator.wasm _site/m-vave/simulator.wasm
          test -s native-emulator/index.html
          test -s native-emulator/worklet.js
          cp native-emulator/index.html native-emulator/worklet.js _site/native-emulator/
          cp app/build/emu/app.wasm _site/native-emulator/app.wasm
          build_sha="${{ github.event.workflow_run.head_sha }}"
          printf 'Build identity: %s\\n' "${build_sha:0:8}"
          build_number="${{ github.event.workflow_run.run_number }}"
          sed -i "s/__FM1_BUILD_NUMBER__/${build_number}/g; s/__FM1_BUILD_SHA__/${build_sha:0:8}/g" _site/native-emulator/index.html
          ! grep -q "__FM1_BUILD_" _site/native-emulator/index.html
          ! grep -q "__FM1_BUILD_SHA__" _site/native-emulator/index.html
          cp native-emulator/startup-lab.html _site/native-emulator/startup-lab.html
      - name: Verify published native emulator payload
        run: |
          test -s _site/native-emulator/index.html
          test -s _site/native-emulator/app.wasm
          test -s _site/native-emulator/worklet.js
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy FM1-Lab
        id: deployment
        uses: actions/deploy-pages@v4
