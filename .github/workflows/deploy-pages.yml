name: Deploy FM1-Lab to GitHub Pages

on:
  push:
    branches: ["main", "feat/fm1lab-product-front-door"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository and pinned emulator
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run FM1-Lab tests
        run: npm test

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.64

      - name: Fetch pinned Felucca firmware source
        run: |
          # The pinned preview commit was withdrawn from upstream's advertised refs.
          # Fetch immutable source archives by SHA so the build does not depend on a
          # branch/tag continuing to point at this historical browser-host snapshot.
          FELUCCA_SHA=743551712c36b3984392eea1dbe13a309907e17a
          ENGINES_SHA=0f015add84d77d8ae0ead08de901b7ecf3686f18
          BSP_SHA=5942e68b89ab9ccd23f2c541d712ca38fe635f11
          mkdir -p vendor/felucca
          curl --fail --location --retry 3 --retry-all-errors \
            "https://codeload.github.com/hugelton/Felucca/tar.gz/${FELUCCA_SHA}" \
            --output /tmp/felucca.tar.gz
          tar -xzf /tmp/felucca.tar.gz --strip-components=1 -C vendor/felucca
          mkdir -p vendor/felucca/firmware/engines vendor/felucca/firmware/bsp
          curl --fail --location --retry 3 --retry-all-errors \
            "https://codeload.github.com/hugelton/Felucca-Engines/tar.gz/${ENGINES_SHA}" \
            --output /tmp/felucca-engines.tar.gz
          tar -xzf /tmp/felucca-engines.tar.gz --strip-components=1 -C vendor/felucca/firmware/engines
          curl --fail --location --retry 3 --retry-all-errors \
            "https://codeload.github.com/hugelton/felucca-bsp/tar.gz/${BSP_SHA}" \
            --output /tmp/felucca-bsp.tar.gz
          tar -xzf /tmp/felucca-bsp.tar.gz --strip-components=1 -C vendor/felucca/firmware/bsp
          git -C vendor/felucca init --quiet
          git -C vendor/felucca apply ../../patches/felucca-host-fm1lab-api.patch

      - name: Build Felucca's browser-native firmware runtime
        working-directory: vendor/felucca
        run: |
          python -m pip install --disable-pip-version-check Pillow fonttools
          ./build.sh gen
          ./build.sh web

      - name: Verify FM1-Lab native FM6 bridge
        run: node scripts/felucca-api-smoke.mjs vendor/felucca/build/web/felucca.wasm

      - name: Run Felucca FM6 and browser-host regression suite
        working-directory: vendor/felucca
        run: sh tests/run_tests.sh

      - name: Install WebAssembly target
        run: rustup target add wasm32-unknown-unknown

      - name: Run upstream emulator Rust tests
        run: cargo test --release -p fm1-isa -p fm1-core -p fm1-soc -p fm1-web
        working-directory: vendor/fm1-emu

      - name: Run upstream emulator browser-code tests
        run: node --test web/*.test.mjs
        working-directory: vendor/fm1-emu

      - name: Build the upstream emulator as a supporting compatibility bench
        run: vendor/fm1-emu/tools/build_site.sh _compat

      - name: Smoke-test emulated firmware and audio output
        run: node vendor/fm1-emu/web/smoke.mjs _compat

      - name: Verify emulator flash persistence round trip
        run: node vendor/fm1-emu/web/persistence.wasm.mjs _compat

      - name: Assemble FM1-Lab product site and supporting runtimes
        run: |
          mkdir -p _site/compatibility _site/felucca _site/src _site/scripts
          cp -R _compat/. _site/compatibility/
          cp -R vendor/felucca/build/web/. _site/felucca/
          cp vendor/felucca/LICENSE vendor/felucca/LICENSING.md _site/felucca/
          cp -R vendor/felucca/LICENSES _site/felucca/
          cp index.html _site/index.html
          cp -R src/. _site/src/
          cp testing.html _site/testing.html
          cp .nojekyll _site/
          cp scripts/felucca-midi-smoke.fm1 _site/scripts/

      - name: Verify the built product in headless Chromium
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium
          python -m http.server 4173 --directory _site > /tmp/fm1lab-http.log 2>&1 &
          node scripts/browser-e2e.mjs

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
