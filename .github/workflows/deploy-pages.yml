name: FM1-Lab · M-VAVE native engine

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out FM1-Lab and official M-VAVE source
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply FM1-Lab extensions to M-VAVE simulator
        run: |
          git -C vendor/m-vave-fm1 apply --check ../../patches/m-vave-instrument-api.patch
          git -C vendor/m-vave-fm1 apply ../../patches/m-vave-instrument-api.patch
      - name: Test Instrument and macro behavior
        run: npm test
      - name: Build official M-VAVE browser engine
        run: bash scripts/build-m-vave-simulator.sh
      - name: Verify official engine API
        run: node scripts/check-m-vave-api.mjs vendor/m-vave-fm1/build/web/simulator.wasm
      - name: Assemble the FM1-Lab workshop
        run: |
          mkdir -p _site/src _site/m-vave
          cp index.html _site/index.html
          cp .nojekyll _site/.nojekyll
          cp src/* _site/src/
          cp vendor/m-vave-fm1/sdk/Simulator.js _site/m-vave/Simulator.js
          cp vendor/m-vave-fm1/build/web/simulator.wasm _site/m-vave/simulator.wasm
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy FM1-Lab
        id: deployment
        uses: actions/deploy-pages@v4
