<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>FM1 · Shipwreck Startup</title>
<style>
:root{color-scheme:dark;--bg:#090d16;--panel:#111a29;--ink:#dce9f7;--muted:#8496ad;--cyan:#55e7ed}
*{box-sizing:border-box}
body{margin:0;min-height:100svh;padding:22px 14px 30px;background:radial-gradient(ellipse at 50% 12%,#15233a 0,#090d16 58%);color:var(--ink);font:14px/1.4 ui-sans-serif,system-ui,-apple-system,sans-serif}
main{width:min(100%,520px);margin:auto}
.eyebrow{font-size:11px;letter-spacing:.2em;color:var(--cyan);text-transform:uppercase}
.heading{font-size:22px;font-weight:700;letter-spacing:.04em;margin:5px 0 3px}
.sub{color:var(--muted);margin:0 0 18px;font-size:13px}
.stage{background:#03060c;border:1px solid #26374c;border-radius:16px;padding:14px;box-shadow:0 16px 50px #0008}
.screen-wrap{width:min(100%,400px);margin:auto;aspect-ratio:1;background:#02040a;border:1px solid #26364b;box-shadow:inset 0 0 0 4px #0a1220;display:grid;place-items:center;overflow:hidden}
canvas{width:100%;height:100%;display:block;image-rendering:auto}
.controls{display:grid;grid-template-columns:1fr;gap:10px;margin-top:14px}
.control{background:var(--panel);border:1px solid #26364b;border-radius:10px;padding:10px}
.control label{display:flex;justify-content:space-between;color:#c9d8e9;font-size:12px;margin-bottom:7px}
.control output{color:var(--cyan);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--cyan)}
.actions{display:flex;gap:8px;margin-top:10px}
.actions button{flex:1;border:1px solid #35506c;background:#17253a;color:#e5f2ff;border-radius:9px;padding:11px;font:600 13px ui-sans-serif,system-ui}
.actions button.primary{background:#173e55;border-color:#3d9aa9}
.note{color:var(--muted);font-size:11px;margin:12px 2px 0;text-align:center}
</style>
</head>
<body>
<main>
<div class="eyebrow">FM1 · NATIVE 240 × 240 STUDY</div>
<div class="heading">SHIPWRECK / STARTUP</div>
<p class="sub">Simple title reveal · hold · fade out</p>
<section class="stage">
<div class="screen-wrap"><canvas id="screen" width="240" height="240" aria-label="SHIPWRECK title fading in and out"></canvas></div>
<div class="controls">
<div class="control"><label for="duration">Fade duration <output id="durationOut">1.2 s</output></label><input id="duration" type="range" min=".4" max="2.4" step=".1" value="1.2"></div>
</div>
<div class="actions"><button class="primary" id="restart">↻ Replay</button><button id="toggle">Ⅱ Pause</button></div>
</section>
<p class="note">240 × 240 native canvas · clean antialiased type · no additional effects</p>
</main>
<script>
(()=> {
const canvas=document.getElementById('screen'),ctx=canvas.getContext('2d');
const duration=document.getElementById('duration'),durationOut=document.getElementById('durationOut'),toggle=document.getElementById('toggle');
const bg='#03060c',title='#f5d52f';
let start=performance.now(),paused=false,pauseAt=0;
function draw(now){
 if(!paused){
  const fade=Number(duration.value),elapsed=(now-start)/1000;
  const fadeIn=Math.min(1,elapsed/fade);
  const hold=.9;
  const fadeOut=Math.max(0,Math.min(1,(elapsed-fade-hold)/fade));
  const alpha=elapsed<fade?fadeIn:elapsed<fade+hold?1:elapsed<fade*2+hold?1-fadeOut:0;
  ctx.clearRect(0,0,240,240);
  ctx.fillStyle=bg;ctx.fillRect(0,0,240,240);
  ctx.save();
  ctx.globalAlpha=Math.max(0,Math.min(1,alpha));
  ctx.fillStyle=title;
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.font='700 25px Arial, Helvetica, sans-serif';
  ctx.letterSpacing='1.1px';
  ctx.fillText('SHIPWRECK',120,120);
  ctx.restore();
  if(elapsed>=fade*2+hold+1.1)start=now;
 }
 requestAnimationFrame(draw);
}
requestAnimationFrame(draw);
duration.addEventListener('input',()=>durationOut.value=Number(duration.value).toFixed(1)+' s');
document.getElementById('restart').addEventListener('click',()=>{start=performance.now();if(paused){paused=false;toggle.textContent='Ⅱ Pause';}});
toggle.addEventListener('click',()=>{if(!paused){paused=true;pauseAt=performance.now();toggle.textContent='▶ Play';}else{start+=performance.now()-pauseAt;paused=false;toggle.textContent='Ⅱ Pause';}});
})();
</script>
</body>
</html>
